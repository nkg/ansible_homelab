---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Verify restic is installed
      ansible.builtin.command: restic version
      register: restic_version_check
      changed_when: false
      failed_when: restic_version_check.rc != 0

    - name: Check backup directory exists
      ansible.builtin.stat:
        path: /opt/backups/restic
      register: restic_backup_dir_stat

    - name: Assert backup directory exists
      ansible.builtin.assert:
        that:
          - restic_backup_dir_stat.stat.exists
          - restic_backup_dir_stat.stat.isdir
          - restic_backup_dir_stat.stat.mode == '0750'
        fail_msg: "Backup directory /opt/backups/restic not found or wrong permissions"

    - name: Check pre-dumps directory exists
      ansible.builtin.stat:
        path: /opt/backups/restic/pre-dumps
      register: restic_predumps_stat

    - name: Assert pre-dumps directory exists
      ansible.builtin.assert:
        that:
          - restic_predumps_stat.stat.exists
          - restic_predumps_stat.stat.isdir
        fail_msg: "Pre-dumps directory not found"

    - name: Check backup script is deployed
      ansible.builtin.stat:
        path: /opt/backups/restic/restic-backup.sh
      register: restic_script_stat

    - name: Assert backup script exists and is executable
      ansible.builtin.assert:
        that:
          - restic_script_stat.stat.exists
          - restic_script_stat.stat.mode == '0750'
        fail_msg: "Backup script not found or not executable"

    - name: Read backup script content
      ansible.builtin.slurp:
        src: /opt/backups/restic/restic-backup.sh
      register: restic_script_slurp

    - name: Verify backup script contains database dump commands
      ansible.builtin.assert:
        that:
          - "'pg_dump' in restic_script_slurp.content | b64decode"
          - "'paperless' in restic_script_slurp.content | b64decode"
          - "'authentik' in restic_script_slurp.content | b64decode"
          - "'restic backup' in restic_script_slurp.content | b64decode"
          - "'restic forget' in restic_script_slurp.content | b64decode"
        fail_msg: "Backup script missing expected content"

    - name: Verify backup script contains exclude patterns
      ansible.builtin.assert:
        that:
          - "'--exclude=\"*.tmp\"' in restic_script_slurp.content | b64decode"
          - "'--exclude=\"*.log\"' in restic_script_slurp.content | b64decode"
        fail_msg: "Backup script missing exclude patterns"

    - name: Verify backup script contains retention policy
      ansible.builtin.assert:
        that:
          - "'--keep-daily' in restic_script_slurp.content | b64decode"
          - "'--keep-weekly' in restic_script_slurp.content | b64decode"
          - "'--keep-monthly' in restic_script_slurp.content | b64decode"
        fail_msg: "Backup script missing retention policy (keep-daily/weekly/monthly)"

    - name: Verify backup script contains all expected databases
      # Database list comes from converge.yml's restic_databases var
      # ([paperless, authentik]) — keep these aligned if either side
      # changes.
      ansible.builtin.assert:
        that:
          - "'paperless' in restic_script_slurp.content | b64decode"
          - "'authentik' in restic_script_slurp.content | b64decode"
        fail_msg: "Backup script missing expected database names"

    - name: Verify cron job is deployed
      ansible.builtin.command: crontab -l
      register: restic_cron_result
      changed_when: false
      failed_when: false

    - name: Assert restic cron schedule exists
      ansible.builtin.assert:
        that:
          - "'0 3' in restic_cron_result.stdout"
          - "'restic-backup.sh' in restic_cron_result.stdout"
        fail_msg: "Restic cron job not found or wrong schedule"
      when: restic_cron_result.rc == 0
