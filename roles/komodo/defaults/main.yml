---
# Komodo wrapper role — deploys Komodo Core (docker compose) and invokes
# bpbradley.komodo for the local Periphery agent.

# --- Komodo Core (compose stack) ---
komodo_base_dir: /opt/komodo
komodo_core_image: ghcr.io/moghtech/komodo-core
# Komodo's own compose defaults to `2` (latest 2.x), but a floating major
# tag is non-reproducible — a stray re-pull silently jumps versions. Pin
# the exact patch; bump deliberately in lockstep with komodo_periphery_version.
komodo_core_version: "2.2.0"
komodo_core_port: 9120
komodo_core_host: localhost

# Database backend — plain MongoDB. Komodo's officially-tested DB.
# (We previously used FerretDB v2 to avoid SSPL across the broader stack,
# but with only Komodo needing Mongo, the FerretDB compatibility tax
# isn't worth it. SSPL doesn't trigger for single-tenant self-host.)
#
# Pin to a specific patch tag; bump deliberately. mongo:7 matches
# Komodo's official compose example; mongo:8 also works.
komodo_mongo_image: mongo:7-jammy
komodo_db_username: komodo
komodo_db_password: changeme

# Komodo Core auth/secret material — override via host_vars + SOPS.
# v2 uses PKI: periphery's Ed25519 public key (generated by bpbradley.komodo
# on install) must be trusted by Core.
#
# komodo_periphery_public_keys: list of every trusted periphery .pub. Core
# rendered KOMODO_PERIPHERY_PUBLIC_KEY joins these with commas. Empty/blank
# entries are dropped, so optional per-host keys can stay templated with a
# default(''). Preferred over the singular komodo_periphery_public_key.
komodo_periphery_public_keys: []
komodo_periphery_public_key: changeme
komodo_webhook_secret: changeme
komodo_jwt_secret: changeme

# Local username/password auth on the Komodo UI. Without this (or another
# auth method like OIDC/GitHub/Google), Komodo refuses logins with
# "No login methods have been configured".
komodo_local_auth: true
# Initial admin user created on first start. Komodo only acts on these the
# first time it sees an empty users collection — afterwards the values are
# ignored, so they're safe to leave set.
komodo_init_admin_username: admin
komodo_init_admin_password: changeme

# Auth rate limit. Komodo's defaults (5 attempts / 15s) apply to *all*
# auth-validating endpoints, including the SPA's per-page /user check —
# not just login POSTs. An SPA that fans out several requests on initial
# load can blow through 5 attempts on its own and trip a 429 bounce-loop.
# Bump to comfortable headroom; credential-stuffing protection is still
# meaningful at 60 attempts/60s and the IP comes from cf-connecting-ip
# via the cloudflared tunnel.
komodo_auth_rate_limit_max_attempts: 60
komodo_auth_rate_limit_window_seconds: 60

# --- Komodo Periphery (passed to bpbradley.komodo) ---
# Default to install; the role also accepts `update` and `uninstall`.
komodo_action: install
komodo_periphery_port: 8120
# Pin Periphery binary version. bpbradley.komodo's own default lags behind
# Core's release cadence, and a v1 Periphery cannot speak to v2 Core (auth
# model changed: passkey → Noise/Ed25519). Keep major aligned with
# komodo_core_version.
komodo_periphery_version: v2.2.0
# Lock Periphery so it only accepts handshakes from the configured Core.
# When empty, Periphery accepts unauthenticated callers (Komodo's default).
# Populate from `secrets.komodo.core_public_key` once Core has come up and
# its /config/keys/core.pub is captured.
komodo_periphery_core_public_keys: ""

# --- Outbound mode (Periphery dials Core) ---
# Even though Core is co-located on this VM, dialing outbound brings the
# Komodo VM into line with apps/pve/onsite — one auth path across the
# fleet, no docker-bridge / host.docker.internal coupling. The websocket
# round-trips through the same Cloudflare tunnel that exposes Core's UI.
komodo_periphery_outbound_mode: false
komodo_periphery_core_address: "https://komodo.regularmusic.com:8443"
# Server name announced to Core when dialing. Core matches this against
# the `name` of a Server resource in its DB; without it Core can't
# associate the connection. Defaults to inventory_hostname.
komodo_periphery_connect_as: "{{ inventory_hostname }}"

# --- Cloudflare Zero Trust tunnel sidecar ---
# Set komodo_cloudflared_enabled: true on hosts that need to expose
# Komodo Core externally via a Cloudflare tunnel. The token is the base64
# JSON blob from the Zero Trust dashboard ({a, t, s}); store in SOPS as
# secrets.cloudflare.komodo_tunnel_token and reference from host_vars.
# Ingress rules + DNS for the tunnel are managed by tofu in
# infrastructure/cloudflare/terraform/komodo_tunnel.tf.
komodo_cloudflared_enabled: false
# Tunnel + account IDs — stable across Cloudflare-side secret rotations.
# Decoded once from the connector token's JSON ({a, t}) and pinned here.
# The connector token itself (incl. the rotating `s` secret) is fetched
# at deploy time by the role from Cloudflare's API — set in host_vars.
komodo_cloudflared_account_id: ""
komodo_cloudflared_tunnel_id: ""
# Populated at runtime by the role's "Fetch current cloudflared tunnel
# token from Cloudflare API" task. Don't set here.
komodo_cloudflared_tunnel_token: ""
# Pin the image. cloudflared uses calver-ish tags; verify recent stable
# at https://github.com/cloudflare/cloudflared/releases before bumping.
komodo_cloudflared_image: cloudflare/cloudflared:2026.5.2
