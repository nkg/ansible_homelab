---
# =============================================================================
# Role: komodo — Deploy Komodo Core (docker compose) + Periphery (systemd)
# =============================================================================

- name: Validate critical Komodo secrets are not default values
  ansible.builtin.assert:
    that:
      - komodo_db_password != 'changeme'
      # At least one real trusted periphery key. Prefer the list
      # (komodo_periphery_public_keys); fall back to the singular var for
      # legacy overrides. Blank + 'changeme' entries don't count.
      - >-
        ((komodo_periphery_public_keys | default([])) | map('trim') | select | reject('eq', 'changeme') | list | length > 0)
        or ((komodo_periphery_public_key | default('changeme')) not in ['', 'changeme'])
      - komodo_webhook_secret != 'changeme'
      - komodo_jwt_secret != 'changeme'
      - komodo_init_admin_password != 'changeme'
    fail_msg: >-
      One or more komodo secrets still have the default 'changeme' value.
      Populate `secrets.komodo.*` in group_vars/secrets.enc.yml. The
      periphery public key is generated by bpbradley.komodo on install —
      bootstrap the VM once, then copy the public key from the periphery
      host into SOPS.
    quiet: true

# --- Cloudflared connector token: fetch live from Cloudflare API ---
# The tunnel's connector token (the base64 JSON {a, t, s}) gets its `s`
# (secret) field rotated by Cloudflare on various events (UI edits, tofu
# resource recreation, etc.). A SOPS snapshot of the token goes stale
# silently and the cloudflared sidecar fails with "Unauthorized: Tunnel
# not found" until someone manually re-syncs.
#
# Fix: fetch the current valid token at deploy time. The DNS API token
# already in SOPS has the `cfd_tunnel: read` permission needed.
- name: Fetch current Komodo cloudflared tunnel token from Cloudflare API
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/accounts/{{ komodo_cloudflared_account_id }}/cfd_tunnel/{{ komodo_cloudflared_tunnel_id }}/token"
    method: GET
    headers:
      Authorization: "Bearer {{ secrets.cloudflare.regularmusic_com_dns_api_token }}"
    return_content: true
    status_code: 200
  register: komodo_cloudflared_token_resp
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  when: komodo_cloudflared_enabled | default(false)

- name: Set komodo_cloudflared_tunnel_token from API response
  ansible.builtin.set_fact:
    komodo_cloudflared_tunnel_token: "{{ komodo_cloudflared_token_resp.json.result }}"
  no_log: true
  when: komodo_cloudflared_enabled | default(false)

- name: Create Komodo base directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ komodo_base_dir }}"
    - "{{ komodo_base_dir }}/backups"

- name: Deploy Komodo compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ komodo_base_dir }}/compose.yaml"
    mode: "0640"
  notify: Restart komodo stack

- name: Deploy Komodo environment file
  # Named `.env` so docker compose auto-loads it for ${VAR} interpolation in
  # compose.yaml. Also referenced explicitly via `env_file:` for Core runtime.
  ansible.builtin.template:
    src: compose.env.j2
    dest: "{{ komodo_base_dir }}/.env"
    mode: "0600"
  notify: Restart komodo stack

# Pull + start the stack in one task. docker_compose_v2 reports `changed`
# only when an image was actually pulled or a container recreated, so this
# stays idempotent on no-op runs (unlike `docker compose pull`, which always
# exits 0 with no signal, and our previous `changed_when: true` workaround,
# which lied to ansible).
- name: Bring up Komodo Core stack
  community.docker.docker_compose_v2:
    project_src: "{{ komodo_base_dir }}"
    state: present
    pull: missing

# --- Periphery agent (bpbradley.komodo) ---
# Installed as a systemd service so Komodo Core can manage local containers
# on the same host. Keeps periphery + core co-located by default.
# `komodo_version` is pinned via vars to match the Core image major and
# avoid the bpbradley role re-downloading the binary on every run when its
# default drifts.
# Gate the bpbradley.komodo include on a version check. The upstream
# role unconditionally stops periphery, removes the binary, and
# re-downloads on every run (its update.yml uses get_url with
# force: true and no version comparison). Reading the installed
# version first lets us skip the include entirely on idempotent runs.
- name: Check installed Periphery binary version
  ansible.builtin.command: /home/komodo/.local/bin/periphery --version
  register: komodo_periphery_installed
  changed_when: false
  failed_when: false
  become: true

- name: Install Komodo Periphery via bpbradley.komodo
  ansible.builtin.include_role:
    name: bpbradley.komodo
  vars:
    komodo_version: "{{ komodo_periphery_version }}"
  when: komodo_periphery_installed.rc != 0
        or (komodo_periphery_version | regex_replace('^v', ''))
            not in komodo_periphery_installed.stdout

# --- Overrides file: our hardening + outbound config, separate from
# bpbradley's render. Loaded via a second `--config-path` so bpbradley
# can rewrite its file freely without us fighting it. Same pattern as
# roles/komodo_periphery and roles/proxmox_periphery.
- name: Render Periphery overrides.toml
  ansible.builtin.template:
    src: overrides.toml.j2
    dest: /home/komodo/.config/komodo/overrides.toml
    owner: komodo
    group: komodo
    mode: "0640"
  become: true
  notify: Restart komodo periphery

# --- Systemd drop-in: tell Periphery to also load our overrides file ---
- name: Ensure Periphery systemd drop-in dir exists
  ansible.builtin.file:
    path: /home/komodo/.config/systemd/user/periphery.service.d
    state: directory
    owner: komodo
    group: komodo
    mode: "0750"
  become: true

- name: Render Periphery systemd drop-in
  ansible.builtin.template:
    src: periphery-override.conf.j2
    dest: /home/komodo/.config/systemd/user/periphery.service.d/override.conf
    owner: komodo
    group: komodo
    mode: "0640"
  become: true
  notify:
    - Reload komodo user systemd
    - Restart komodo periphery

# --- Cleanup: remove leftover lineinfile entry from the previous role
# version that wrote core_public_keys directly into bpbradley's file.
# Harmless if left (overrides.toml wins via merge-nested-config), but
# tidying up avoids confusion when reading the base config. Idempotent.
- name: Remove legacy core_public_keys line from bpbradley-rendered config
  ansible.builtin.lineinfile:
    path: /home/komodo/.config/komodo/periphery.config.toml
    regexp: '^core_public_keys\s*='
    state: absent
  become: true
  notify: Restart komodo periphery
